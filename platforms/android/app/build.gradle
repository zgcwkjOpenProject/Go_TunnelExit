plugins { id 'com.android.application' }

android {
    namespace 'com.zgcwkj.tunnelexit'
    compileSdk 36
    defaultConfig {
        applicationId 'com.zgcwkj.tunnelexit'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName (project.findProperty('appVersion') ?: '1.0')
        // 打包的客户端二进制只支持 arm64，避免把不匹配的 ABI 也声明进 APK
        ndk { abiFilters 'arm64-v8a' }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // 客户端二进制以 libtunnelexit-client.so 形式放进 jniLibs，
    // Android 只允许从应用 native 库目录执行文件，因此必须先解包再 exec
    androidResources {
        noCompress 'so'
    }
}
